name: Native release builds

on:
  workflow_dispatch:
  push:
    branches:
      - release/*

permissions:
  contents: read

jobs:
  linux:
    name: Ubuntu 24.04 ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    env:
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev \
            libqt6opengl6-dev qt6-image-formats-plugins fonts-noto-cjk \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxss-dev xvfb xauth appstream
      - name: Read release version
        run: |
          release_version=$(node -p "require('./package.json').version")
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
      - name: Test and build
        run: linux/MatrixCode/scripts/verify.sh
      - name: Package Debian installer
        run: linux/MatrixCode/scripts/package-deb.sh
      - name: Verify package and installed renderer
        env:
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          package_path="$GITHUB_WORKSPACE/linux/MatrixCode/out/build/linux-release/matrixcode_${RELEASE_VERSION}_${RELEASE_ARCHITECTURE}.deb"
          test -f "$package_path"
          test "$(dpkg-deb --field "$package_path" Version)" = "$RELEASE_VERSION"
          test "$(dpkg-deb --field "$package_path" Architecture)" = "$RELEASE_ARCHITECTURE"
          sudo apt-get install -y "$package_path"
          mkdir -p out/captures
          timeout 60s xvfb-run -a -s '-screen 0 1280x720x24' \
            /usr/bin/MatrixCode --software --capture "out/captures/linux-${RELEASE_ARCHITECTURE}.png"
          test -s "out/captures/linux-${RELEASE_ARCHITECTURE}.png"
          sudo apt-get purge -y matrixcode
          test ! -e /usr/bin/MatrixCode
          sha256sum "$package_path" > "out/captures/linux-${RELEASE_ARCHITECTURE}-SHA256SUMS.txt"
      - name: Upload Debian installer and capture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.architecture }}
          path: |
            linux/MatrixCode/out/build/linux-release/*.deb
            out/captures/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 and ARM64 packages
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WiX 4
        run: |
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
      - name: Read release version
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify Debug x64 tests and WARP renderer
        run: ./windows/MatrixCode/scripts/Verify-Windows.ps1 -Architecture x64 -Configuration Debug -Capture
      - name: Build release packages for both architectures
        run: ./windows/MatrixCode/scripts/Build-Release.ps1 -Version $env:RELEASE_VERSION -Publisher 'James Bedford'
      - name: Upload Windows release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: windows/MatrixCode/out/artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload ARM64 validation executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm64-validation
          path: |
            windows/MatrixCode/out/build/windows-arm64/Release/MatrixCodeNativeTests.exe
            windows/MatrixCode/out/build/windows-arm64/Release/MatrixCodeRenderCapture.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload x64 WARP capture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-capture
          path: windows/MatrixCode/out/captures/windows-x64.png
          if-no-files-found: error
          retention-days: 30

  windows-arm64:
    name: Native Windows ARM64 validation
    needs: windows
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download ARM64 validation executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-arm64-validation
          path: validation
      - name: Run native ARM64 tests and WARP capture
        run: |
          & ./validation/MatrixCodeNativeTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 tests failed.' }
          & ./validation/MatrixCodeRenderCapture.exe --output windows-arm64.png
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 WARP capture failed.' }
          if (-not (Test-Path -LiteralPath windows-arm64.png -PathType Leaf)) { throw 'ARM64 capture is missing.' }
      - name: Upload ARM64 WARP capture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm64-capture
          path: windows-arm64.png
          if-no-files-found: error
          retention-days: 30
