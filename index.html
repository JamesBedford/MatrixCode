<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="An open-source Matrix digital rain effect for your browser, with customisable colours, messages and controls." />
    <!-- Link previews (Messages, social apps). Crawlers need absolute URLs; see docs/share-card.md. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Julimbob" />
    <meta property="og:title" content="Matrix Code" />
    <meta property="og:description" content="An open-source Matrix digital rain effect for your browser, with customisable colours, messages and controls." />
    <meta property="og:url" content="https://julimbob.com/matrixcode/" />
    <meta property="og:image" content="https://julimbob.com/matrixcode/share-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Green Matrix digital rain: columns of glowing glyphs falling down a black screen." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Fully self-contained and offline: forbid every network connection (fetch/XHR/WebSocket/etc.). -->
    <meta http-equiv="Content-Security-Policy" content="connect-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0D0208" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Matrix" />
    <title>Matrix</title>
  </head>
  <body>
    <div id="app" role="presentation"></div>
    <noscript>This effect requires JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
